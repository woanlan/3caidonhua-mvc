<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra Cứu & Lịch Sử Đơn Hàng — 3caidonhua</title>
  <link rel="icon" type="image/png" href="assets/logo3cai.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background:#090c10;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">

  <!-- HEADER NAVBAR -->
  <header style="background:rgba(15,23,42,0.95);border-bottom:1px solid #334155;position:sticky;top:0;z-index:999;backdrop-filter:blur(10px);padding:14px 24px;">
    <div style="max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;">
      <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
        <img src="assets/logo3cai.png" alt="3caidonhua" style="height:38px;object-fit:contain;">
        <span style="font-weight:900;color:#fff;font-size:18px;letter-spacing:1px;">3 CÂY ĐÒN HỨA</span>
      </a>

      <nav style="display:flex;align-items:center;gap:22px;font-size:14.5px;font-weight:600;">
        <a href="index.html" style="color:#cbd5e1;text-decoration:none;">Trang chủ</a>
        <a href="products.html" style="color:#cbd5e1;text-decoration:none;">Bộ sưu tập</a>
        <a href="orders.html" style="color:#e60012;text-decoration:none;">Tra cứu đơn</a>
        <a href="cart.html" style="color:#cbd5e1;text-decoration:none;position:relative;">
          🛒 Giỏ hàng
          <span id="cart-badge" style="display:none;position:absolute;top:-8px;right:-14px;background:#e60012;color:#fff;font-size:11px;font-weight:800;padding:1px 6px;border-radius:10px;">0</span>
        </a>
      </nav>

      <div id="nav-user-area" style="display:flex;align-items:center;gap:12px;"></div>
    </div>
  </header>

  <main style="max-width:960px;margin:36px auto 60px;padding:0 24px;">
    <h1 style="font-size:24px;font-weight:800;color:#fff;margin-bottom:8px;">TRA CỨU TIẾN TRÌNH ĐƠN HÀNG</h1>
    <p style="color:#94a3b8;font-size:14px;margin-bottom:24px;">Nhập Mã đơn hàng (Ví dụ: HD123456) hoặc Số điện thoại người nhận để kiểm tra tình trạng giao hàng.</p>

    <!-- Form tra cứu nhanh -->
    <div style="background:#1e293b;border:1px solid #334155;border-radius:16px;padding:24px;margin-bottom:32px;">
      <form id="form-track-order" style="display:flex;gap:12px;">
        <input type="text" id="track-input" required placeholder="Nhập mã đơn hàng HDXXXXXX hoặc Số điện thoại..." style="flex:1;padding:12px 18px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#fff;font-size:14.5px;outline:none;">
        <button type="submit" style="padding:12px 24px;background:#0284c7;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:14.5px;cursor:pointer;">
          Tra cứu &rarr;
        </button>
      </form>
      <div id="track-result" style="margin-top:20px;"></div>
    </div>

    <!-- Lịch sử đơn hàng của tài khoản -->
    <h2 style="font-size:20px;font-weight:800;color:#fff;margin-bottom:16px;">LỊCH SỬ ĐƠN HÀNG CỦA BẠN</h2>
    <div id="orders-container"></div>
  </main>

  <!-- SCRIPT MODULES TÁCH RỜI -->
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/cart.js"></script>
  <script type="module" src="js/orders.js"></script>
</body>
</html>
